<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHNOVA.buzz — The Future Is Now</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css?v=20260404_7">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-link" aria-label="TechNova">
        <img src="images/logo.png?v=20260322_9" alt="TechNova" class="logo-img header-logo">
      </a>
      <div class="header-controls">
        <div class="search-wrap">
          <input class="search-input" type="search" placeholder="Search..." autocomplete="off">
        </div>
      </div>
      <div class="header-tags-container">
        <div class="tags-row">
          <nav id="tag-list" class="tags" aria-label="Tags"></nav>
        </div>
      </div>
    </div>
  </header>


  <main class="page">
    <div class="layout">
      <div class="main-col">
        <section id="featured-section" class="hero" aria-label="Featured">
          <div id="featured-hero" class="hero-left"></div>
          <div id="featured-side" class="hero-right"></div>
        </section>
        <section id="main-articles" class="feed" aria-label="Articles"></section>
      </div>

      <aside class="sidebar" aria-label="Sidebar">
        <section class="sidebar-card latest-card" aria-label="Latest">
          <div class="sidebar-card-title"><span class="sidebar-accent"></span>LATEST STORIES</div>
          <div id="latest-stories" class="sidebar-list"></div>
        </section>
        <section class="sidebar-card" aria-label="Top Stories">
          <div class="sidebar-card-title"><span class="sidebar-accent"></span>TOP STORIES</div>
          <div id="top-stories" class="sidebar-list"></div>
        </section>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-left">
        <img src="images/logo.png?v=20260322_9" alt="TechNova" class="footer-logo">
      </div>
      <div class="footer-right">Copyright © TECHNOVA.buzz - The Future Is Now - Technology News & Insights</div>
    </div>
  </footer>

  <div id="site-modal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="site-modal-title">
      <button id="site-modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      <h2 id="site-modal-title" class="modal-title"></h2>
      <div id="site-modal-body" class="modal-body"></div>
      <div id="site-modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="js/technova.js?v=20260404_7"></script>
</body>
</html>
