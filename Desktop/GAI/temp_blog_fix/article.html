<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova - The Future is Now!</title>
    <meta name="description" content="TechNova brings you the latest tech reviews, gadget comparisons, and cutting-edge technology news. Discover the best products on Amazon with expert insights.">
    <meta name="keywords" content="tech reviews, gadgets, smartphones, smart home, technology news, Amazon products">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="TechNova - The Future is Now!">
    <meta property="og:description" content="Your ultimate source for tech reviews and gadget recommendations">
    <meta property="og:type" content="website">
    <meta property="og:url" content="/">
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/article.css">
    <link rel="stylesheet" href="css/amazon-cta.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-section">
                <h1 class="logo">
                    <a href="index.html" class="logo-link">
                        <img src="images/logo.png" alt="TechNova Logo" class="logo-image">
                    </a>
                </h1>
            </div>
            
            <div class="header-actions">
                <button class="btn-subscribe">Subscribe</button>
                <span class="and-text">and</span>
                <button class="btn-tip">Send us a Tip!</button>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="main-nav">
            <div class="nav-container">
                <div class="search-box">
                    <input type="search" placeholder="Search..." class="search-input">
                    <div class="search-results-dropdown" id="search-results-dropdown" style="display: none;">
                        <!-- Search results will appear here -->
                    </div>
                </div>
                <div class="tag-list" id="tag-list"></div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content mt-xl">
        <div class="content-container">
            <!-- Latest Articles Section (Main Content) -->
            <section class="latest-section">
                <div class="main-articles glass-panel p-lg" id="main-articles">
                    <!-- Articles will be loaded here dynamically with lazy loading -->
                    <div id="main-load-more-trigger" class="load-more-trigger"></div>
                </div>
            </section>

            <!-- Sidebar -->
            <aside class="sidebar">
                <h2 class="sidebar-title">TOP STORIES</h2>
                <div class="top-stories" id="top-stories">
                    <!-- Random articles will be loaded here (max 7) -->
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="images/logo.png" alt="TechNova Logo" class="footer-logo-image">
            </div>
            <div class="footer-links">
                <a href="/docs">Documentation</a>
                <a href="mailto:support@technova.buzz">Support</a>
                <a href="https://github.com/kimsondreams">GitHub</a>
            </div>
            <div class="footer-copyright">
                <p>Copyright © The Future Is Now - Technology News & Insights</p>
            </div>
        </div>
    </footer>
    
    <!-- JavaScript Files -->
    <script>
        window.__ANALYTICS_SITE_ID__ = 'technova';
        window.__ANALYTICS_COLLECT_URL__ = '/api/analytics/collect';
    </script>
    <script src="js/analytics.js?v=1.1"></script>
    <script src="js/main.js?v=1.3"></script>

    
</body>
</html>
