name: Deploy to Railway

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gai-backend
            path: apps/backend
          - service: gai-worker
            path: apps/worker
          - service: gai-web
            path: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy ${{ matrix.service }} to Railway (with fallback)
        working-directory: ${{ matrix.path }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying service: ${{ matrix.service }} from ${{ matrix.path }}"
          railway up --service "${{ matrix.service }}" --yes || railway up --yes

  no-token-warning:
    if: ${{ secrets.RAILWAY_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain missing token
        run: |
          echo "RAILWAY_TOKEN secret is not set. Skipping deploy."
          echo "Add GitHub secret RAILWAY_TOKEN with your Railway project token to enable auto-deploy."
