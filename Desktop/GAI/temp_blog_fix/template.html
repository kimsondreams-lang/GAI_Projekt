<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ARTICLE_TITLE}} - TechNova</title>
    <meta name="description" content="{{ARTICLE_TITLE}}">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/article.css">
    <link rel="stylesheet" href="css/amazon-cta.css">
    <!-- JSON-LD SCHEMA MARKER -->
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo-section">
                <h1 class="logo">
                    <a href="index.html" class="logo-link">
                        <span class="logo-text"><span class="tech">Tech</span><span class="nova">Nova</span></span>
                    </a>
                </h1>
                <p class="tagline">Your Daily Dose of Innovation</p>
            </div>
        </div>
    </header>
    <main class="article-content">
        <article id="{{ARTICLE_ID}}">
            <h1>{{ARTICLE_TITLE}}</h1>
            <p class="article-meta">By {{ARTICLE_AUTHOR}} | {{ARTICLE_DATE}}</p>
            <div class="article-body">
                {{ARTICLE_CONTENT}}
            </div>
        </article>
    </main>
    <footer class="main-footer">
        <p>Copyright © TechNova</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
